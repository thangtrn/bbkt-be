version: '3.8'
name: local-devhub

services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - '9005:9000' # S3 API
      - '9006:9001' # Web UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin@123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  postgres:
    image: postgres
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis
    container_name: redis
    ports:
      - '6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

networks:
  default:
    driver: bridge

volumes:
  minio-data:
  pgdata:
  redis-data:
