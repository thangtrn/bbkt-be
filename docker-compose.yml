services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - '9000:9000'
      - '9001:9001'

    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: 'root@123'

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

volumes:
  minio_data:
    driver: local
